# Workaround para Windows con locale es-* (sun.jnu.encoding = Cp1252):
# Gradle escribe el argfile con el classpath del worker de test usando file.encoding
# (UTF-8 por defecto), pero el launcher de Java lo relee usando sun.jnu.encoding.
# Si la ruta del proyecto tiene acentos (".../Procesos de seleccion/Prueba tecnica/...")
# los paths se corrompen y todos los tests fallan con ClassNotFoundException.
# Igualar file.encoding al encoding nativo hace que el round-trip funcione.
#
# El encoding de los .java se fija aparte a UTF-8 en build.gradle (options.encoding),
# asi que esta linea no afecta la compilacion. En Linux/macOS o en una ruta sin acentos
# se puede eliminar sin consecuencias.
org.gradle.jvmargs=-Dfile.encoding=windows-1252
